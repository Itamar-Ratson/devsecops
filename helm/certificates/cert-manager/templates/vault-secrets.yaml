{{- if .Values.vaultSecrets.enabled }}
# Sync Cloudflare API token from Vault for ACME DNS-01 solver
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  type: kv-v2
  mount: secret
  path: cloudflare/api-token
  destination:
    name: cloudflare-api-token
    create: true
    transformation:
      excludeRaw: true
      templates:
        api-token:
          text: '{{ `{{ index .Secrets "api-token" }}` }}'
  refreshAfter: 1h
  vaultAuthRef: secrets/transit-vault-auth
{{- end }}
