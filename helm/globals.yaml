# Shared non-port configuration for all charts
# Pass this file to helm commands with: -f helm/globals.yaml

# CloudFlare Tunnel — toggle public exposure of services
cloudflare:
  enabled: true
  domain: itamarratson.com
  # CloudFlare Zero Trust team domain (e.g., "myteam" from myteam.cloudflareaccess.com)
  # Set this before enabling cloudflare — used in Keycloak OIDC redirect URIs
  teamDomain: "itamarratson"

# AWS — default region and account for Crossplane-managed resources
aws:
  region: eu-north-1
  accountId: "779846824064"

# Project metadata — used in resource tags
project:
  name: devsecops
  environment: dev
