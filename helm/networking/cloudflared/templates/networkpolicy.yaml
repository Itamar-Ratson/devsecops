{{- if eq .Values.networkPolicy.type "cilium" }}
---
# CiliumNetworkPolicy for cloudflared
# Egress: tunnel connection, gateway, DNS. Ingress: kubelet health checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  egress:
    # Allow traffic to Cilium Gateway
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.gateway.namespace }}
      toPorts:
        - ports:
            - port: "{{ .Values.ports.gateway.https }}"
              protocol: TCP
    # Allow outbound to CloudFlare edge (tunnel connection)
    # Port 7844 is the primary tunnel port; 443 is the fallback
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "7844"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Allow DNS resolution (CoreDNS in kube-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: UDP
  ingress:
    # Allow kubelet health checks
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "{{ .Values.metricsPort }}"
              protocol: TCP
{{- else if eq .Values.networkPolicy.type "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow kubelet health checks (metrics port)
    - ports:
        - protocol: TCP
          port: {{ .Values.metricsPort }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
    # Allow Cloudflare edge (tunnel connection + fallback)
    - ports:
        - protocol: TCP
          port: 7844
        - protocol: TCP
          port: 443
    # Allow traffic to app services
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apps
      ports:
        - protocol: TCP
          port: {{ .Values.ports.httpEcho }}
{{- end }}
