---
# CiliumNetworkPolicy for cloudflared
# Egress: tunnel connection, gateway, DNS. Ingress: kubelet health checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  egress:
    # Allow traffic to Cilium Gateway
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.gateway.namespace }}
      toPorts:
        - ports:
            - port: "{{ .Values.ports.gateway.https }}"
              protocol: TCP
    # Allow outbound to CloudFlare edge (tunnel connection)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "7844"
              protocol: TCP
    # Allow DNS resolution (CoreDNS in kube-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: UDP
  ingress:
    # Allow kubelet health checks
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "{{ .Values.metricsPort }}"
              protocol: TCP
