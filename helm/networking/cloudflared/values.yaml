# Gateway configuration — cloudflared routes through the Cilium Gateway
gateway:
  name: main-gateway
  namespace: gateway

# Vault Secrets — tunnel token delivered via VSO
vaultSecrets:
  enabled: true

image:
  repository: cloudflare/cloudflared
  tag: "2026.2.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
