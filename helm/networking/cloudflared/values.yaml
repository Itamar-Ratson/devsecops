# Gateway configuration — cloudflared routes through the Cilium Gateway
gateway:
  name: main-gateway
  namespace: gateway

# Vault Secrets — tunnel token delivered via VSO
vaultSecrets:
  enabled: true

# External Secrets — tunnel token delivered via ESO (for EKS)
externalSecrets:
  enabled: false
  ssmPath: ""

# Direct ingress — route directly to K8s services (no gateway)
directIngress:
  enabled: false
  rules: []

# Network policy mode: "cilium" (KinD default) or "kubernetes" (EKS)
networkPolicy:
  type: cilium

image:
  repository: cloudflare/cloudflared
  tag: "2026.2.0"
  pullPolicy: IfNotPresent

metricsPort: 2000

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
