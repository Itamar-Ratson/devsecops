image:
  repository: tailscale/tailscale
  tag: "v1.94.2"
  pullPolicy: IfNotPresent

# Subnet routes to advertise to the tailnet
# KinD pod CIDR and service CIDR
routes:
  - "10.244.0.0/16"
  - "10.96.0.0/12"

# Vault Secrets — auth key delivered via VSO
vaultSecrets:
  enabled: true

# External Secrets — auth key delivered via ESO (for EKS)
externalSecrets:
  enabled: false
  ssmPath: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
