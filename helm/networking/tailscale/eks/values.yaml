# Defaults for values normally supplied via ports.yaml
ports:
  dns: 53

image:
  repository: tailscale/tailscale
  tag: "v1.94.2"
  pullPolicy: IfNotPresent

# Tailnet hostname — must be unique across clusters (KinD uses "on-prem")
cluster:
  name: eks

# Subnet routes to advertise to the tailnet
# EKS VPC CIDR
routes:
  - "10.50.0.0/16"

# ExternalSecret — auth key delivered via ESO from SSM
externalSecret:
  ssmKey: /devsecops/tailscale-eks-auth-key
  secretStore: aws-ssm

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
