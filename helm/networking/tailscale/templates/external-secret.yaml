{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tailscale-auth
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-ssm
    kind: ClusterSecretStore
  target:
    name: tailscale-auth
  data:
    - secretKey: auth-key
      remoteRef:
        key: {{ .Values.externalSecrets.ssmPath }}
{{- end }}
