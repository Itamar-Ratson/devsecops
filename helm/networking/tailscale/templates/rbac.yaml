apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: tailscale
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: tailscale
  apiGroup: rbac.authorization.k8s.io
