---
# CiliumNetworkPolicy for Tailscale subnet router
# Egress: Tailscale control plane, WireGuard, DNS, K8s API, pod/service CIDRs.
# Ingress: kubelet health checks.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  egress:
    # Allow Tailscale control plane (coordination server, DERP relay servers)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Allow WireGuard UDP (direct peer connections + DERP relay)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
            - port: "3478"
              protocol: UDP
    # Allow DNS resolution (CoreDNS in kube-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: UDP
    # Allow Kubernetes API access (for storing state in Secret)
    - toEntities:
        - kube-apiserver
    # Allow routing to cluster pods and services (subnet router function)
    - toCIDR:
        - 10.244.0.0/16
        - 10.96.0.0/12
  ingress:
    # Allow kubelet probes and host access
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
    # Allow return traffic from cluster pods (subnet router)
    - fromCIDR:
        - 10.244.0.0/16
        - 10.96.0.0/12
