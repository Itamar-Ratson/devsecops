apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: {{ .Values.className }}-config
spec:
  service:
    type: NodePort
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.className }}
spec:
  controllerName: {{ .Values.controllerName }}
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: {{ .Values.className }}-config
