---
# Allow egress to cluster endpoints (pod-to-pod communication).
# Each service controls its own ingress policy for defense in depth.
# NOTE: This CCNP defeats toFQDNs rules cluster-wide (same as KinD).
# The broad toEndpoints: {} allows DNS to kube-dns at L3/L4, bypassing Cilium's
# DNS L7 proxy. Use toEntities: world with toPorts restrictions instead of toFQDNs.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cluster-egress
spec:
  description: "Allow egress to cluster endpoints"
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
# Allow egress to host entity for node-local services
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-host-egress
spec:
  description: "Allow egress to host network services"
  endpointSelector: {}
  egress:
    - toEntities:
        - host
---
# Allow CoreDNS to reach upstream DNS servers
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-coredns-upstream
  namespace: kube-system
spec:
  description: "Allow CoreDNS to reach upstream DNS"
  endpointSelector:
    matchLabels:
      k8s-app: kube-dns
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: UDP
            - port: "{{ .Values.ports.dns }}"
              protocol: TCP
