# EKS-specific Cilium overrides
# Applied after values.yaml: helm install -f values.yaml -f values-eks.yaml
cilium:
  cluster:
    name: eks
    id: 2
  # Cilium fully replaces kube-proxy via eBPF — kube-proxy addon is NOT installed
  kubeProxyReplacement: true
  # k8sServiceHost/Port set dynamically by Terraform (EKS API endpoint) —
  # required because without kube-proxy, Cilium can't reach the API server
  # via the ClusterIP during bootstrap.
  eni:
    enabled: true
    awsReleaseExcessIPs: true
  ipam:
    mode: eni
  # Cluster Mesh requires same datapath on all clusters — tunnel mode with VXLAN
  routingMode: tunnel
  tunnelProtocol: vxlan
  encryption:
    enabled: true
    type: wireguard
  nodeinit:
    enabled: true
    reconfigureKubelet: true
    removeCbrBridge: false
    restartPods: false
  l2announcements:
    enabled: false
  hostPort:
    enabled: false
  # Clustermesh apiserver + TLS Secrets are created at Helm install time
  # (genSignedCert). Pods stay Pending until nodes exist — that's fine because
  # helm_release uses wait=false (see cilium.tf).
  clustermesh:
    useAPIServer: true
    apiserver:
      replicas: 1
      service:
        type: NodePort
        nodePort: 32379
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
