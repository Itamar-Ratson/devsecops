# KinD-specific Cilium overrides
# Applied after values.yaml: helm install -f values.yaml -f values-kind.yaml
cilium:
  cluster:
    name: kind
    id: 1
  # Cluster Mesh requires same datapath — native routing to match EKS (ENI).
  # KinD nodes share a Docker bridge (L2), so autoDirectNodeRoutes works.
  routingMode: native
  ipv4NativeRoutingCIDR: "10.0.0.0/8"
  autoDirectNodeRoutes: true
  hostPort:
    enabled: true
  socketLB:
    hostNamespaceOnly: true
  l2announcements:
    enabled: true
  clustermesh:
    useAPIServer: true
    apiserver:
      replicas: 1
      service:
        type: NodePort
        nodePort: 32379
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
