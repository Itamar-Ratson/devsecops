---
# CiliumNetworkPolicy for Tailscale Operator pod
# Note: subnet-router DaemonSet uses hostNetwork — CNPs don't apply to it
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale-operator
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app: operator
  egress:
    # Tailscale control plane (coordination server, DERP relay)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # WireGuard UDP (direct peer connections + DERP relay)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
            - port: "3478"
              protocol: UDP
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: UDP
    # Kubernetes API (operator needs RBAC access)
    - toEntities:
        - kube-apiserver
  ingress:
    # Kubelet probes and host access
    - fromEntities:
        - host
        - remote-node
        - kube-apiserver
