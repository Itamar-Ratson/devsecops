{{- if .Values.subnetRouter.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale-subnet-router
  namespace: {{ .Release.Namespace }}
  labels:
    app: tailscale-subnet-router
spec:
  selector:
    matchLabels:
      app: tailscale-subnet-router
  template:
    metadata:
      labels:
        app: tailscale-subnet-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscale-subnet-router
      automountServiceAccountToken: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: create-auth-key
          image: {{ .Values.subnetRouter.image.repo }}:{{ .Values.subnetRouter.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              RESP=$(wget -q -O- --post-data="client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&grant_type=client_credentials" \
                https://api.tailscale.com/api/v2/oauth/token)
              TOKEN=$(echo "$RESP" | sed 's/.*"access_token":"\([^"]*\)".*/\1/')
              KRESP=$(wget -q -O- \
                --header="Authorization: Bearer ${TOKEN}" \
                --header="Content-Type: application/json" \
                --post-data='{"capabilities":{"devices":{"create":{"reusable":false,"ephemeral":true,"preauthorized":true,"tags":["{{ .Values.subnetRouter.tag }}"]}}}}' \
                https://api.tailscale.com/api/v2/tailnet/-/keys)
              KEY=$(echo "$KRESP" | sed 's/.*"key":"\([^"]*\)".*/\1/')
              echo -n "$KEY" > /auth/key
          env:
            - name: CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_secret
          volumeMounts:
            - name: auth
              mountPath: /auth
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: tailscale
          image: {{ .Values.subnetRouter.image.repo }}:{{ .Values.subnetRouter.image.tag }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              # Prevent --accept-routes from hijacking local subnets.
              # Tailscale installs accepted routes in table 52 (rule 5270).
              # If a peer advertises the same subnet we're on, traffic to local
              # nodes would go through tailscale0 instead of eth0. Add higher-
              # priority rules to keep local subnet traffic on the main table.
              {{- range .Values.subnetRouter.routes }}
              ip rule add to {{ . }} lookup main priority 5269 2>/dev/null || true
              {{- end }}

              # Duplicate remote cluster routes into the main routing table.
              # Cilium's eBPF FIB lookup only consults the main table, not
              # Tailscale's table 52 (policy routing). Without this, pod traffic
              # to remote cluster IPs is blackholed.
              # Also MASQUERADE pod traffic to remote subnets — pod source IPs
              # (e.g. 10.0.x.x) fall within ipv4NativeRoutingCIDR so Cilium
              # won't masquerade them, but the remote cluster can't route back
              # to local pod IPs. SNAT to the node's tailscale0 IP instead.
              # Run in background: tailscale0 doesn't exist until containerboot
              # creates it, so we wait for the interface before adding routes.
              {{- if .Values.subnetRouter.remoteRoutes }}
              (
                while ! ip link show tailscale0 >/dev/null 2>&1; do sleep 1; done
                sleep 2  # let containerboot finish interface setup
                {{- range .Values.subnetRouter.remoteRoutes }}
                ip route replace {{ . }} dev tailscale0 table main 2>/dev/null || true
                iptables -t nat -C POSTROUTING -d {{ . }} -o tailscale0 -j MASQUERADE 2>/dev/null || \
                  iptables -t nat -A POSTROUTING -d {{ . }} -o tailscale0 -j MASQUERADE 2>/dev/null || true
                {{- end }}
              ) &
              {{- end }}

              export TS_AUTHKEY=$(cat /auth/key)
              exec /usr/local/bin/containerboot
          env:
            - name: TS_USERSPACE
              value: "false"
            - name: TS_ROUTES
              value: "{{ join "," .Values.subnetRouter.routes }}"
            - name: TS_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_STATE_DIR
              value: /var/lib/tailscale
            - name: TS_KUBE_SECRET
              value: ""
            - name: TS_EXTRA_ARGS
              value: "--accept-routes"
          securityContext:
            privileged: true
          volumeMounts:
            - name: auth
              mountPath: /auth
              readOnly: true
            - name: dev-tun
              mountPath: /dev/net/tun
            - name: state
              mountPath: /var/lib/tailscale
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
      volumes:
        - name: auth
          emptyDir: {}
        - name: dev-tun
          hostPath:
            path: /dev/net/tun
        - name: state
          emptyDir: {}
{{- end }}
