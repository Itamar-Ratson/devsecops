apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: eks-echo
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - "eks-echo.{{ .Values.cloudflare.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: http-echo
          port: {{ .Values.ports.httpService }}
