gateway:
  name: main-gateway
  namespace: gateway

image:
  repository: bkimminich/juice-shop
  # Pin to specific version — never use :latest for a publicly-exposed vulnerable app
  tag: v17.1.1@sha256:9e437b456e444ff001d1663e4f6f05c796fe02f1058dd2651d6791a15b43dfeb
  pullPolicy: IfNotPresent

# For pulling from private registries (e.g., GHCR)
imagePullSecrets: []
  # - name: ghcr-pull-secret

resources:
  limits:
    memory: "512Mi"
    cpu: "500m"
  requests:
    memory: "256Mi"
    cpu: "100m"

replicaCount: 1

# Pod security context - applies to all containers
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# Container security context
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Juice-shop needs write access for SQLite
  capabilities:
    drop:
      - ALL
