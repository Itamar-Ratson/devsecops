{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-echo
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: http-echo
  template:
    metadata:
      labels:
        app: http-echo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: http-echo
          image: hashicorp/http-echo:latest
          args:
            - -text={{ .Values.message }}
          ports:
            - containerPort: {{ .Values.ports.httpEcho }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
{{- end }}
