{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-echo
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: https
  hostnames:
    - "echo.{{ .Values.cloudflare.domain }}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: http-echo-stable
          port: {{ .Values.ports.httpService }}
          weight: 100
        - name: http-echo-canary
          port: {{ .Values.ports.httpService }}
          weight: 0
{{- end }}
