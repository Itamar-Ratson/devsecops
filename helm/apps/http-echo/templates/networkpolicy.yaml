{{- if eq .Values.networkPolicy.type "cilium" }}
---
# Allow ingress to http-echo from Gateway (Cilium Gateway uses ingress identity)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-from-gateway
spec:
  endpointSelector:
    matchLabels:
      app: http-echo
  ingress:
    - fromEntities:
        - ingress
      toPorts:
        - ports:
            - port: "{{ .Values.ports.httpEcho }}"
              protocol: TCP
    # Allow Prometheus to scrape (if app exposes metrics)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "{{ .Values.ports.httpEcho }}"
              protocol: TCP
{{- else if eq .Values.networkPolicy.type "kubernetes" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-echo
spec:
  podSelector:
    matchLabels:
      app: http-echo
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cloudflared
          podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - protocol: TCP
          port: {{ .Values.ports.httpEcho }}
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: {{ .Values.ports.dns }}
{{- end }}
