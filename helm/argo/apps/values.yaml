repoURL: "git@github.com:Itamar-Ratson/devsecops.git"
targetRevision: HEAD

# KinD Docker network IPs — overridden by Terraform valuesObject at runtime
transitVaultIP: "172.18.0.100"
cacheRegistryIP: "172.18.0.101"

# Let's Encrypt ACME email — overridden by Terraform valuesObject at runtime
acmeEmail: ""

# Per-application toggles — disabled by default to save resources
applications:
  # Cloudflare Tunnel — enabled by default for external access via cloudflared.
  cloudflared:
    enabled: true
  # Kafka UI — disabled to save ~256Mi. Re-enable for visual topic/consumer debugging.
  kafkaUi:
    enabled: false
  # Juice Shop — disabled to save ~256Mi. Enabled in CI via ci-values.yaml for DAST.
  juiceShop:
    enabled: false
