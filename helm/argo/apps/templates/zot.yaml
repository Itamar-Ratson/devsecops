# Wave 6 — Registry: Zot OCI registry cache proxy
# Dependencies: gateway (wave 5), registry namespace (wave -1 via network-policies)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zot
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/registry/zot
    helm:
      valueFiles:
        - ../../ports.yaml
        - values.yaml
      valuesObject:
        cacheRegistryIP: {{ .Values.cacheRegistryIP | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
