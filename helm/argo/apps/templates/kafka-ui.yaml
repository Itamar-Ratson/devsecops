# Wave 8 — Observability: Kafka UI
# Dependencies: kafka (wave 5), gateway (wave 5)
{{- if .Values.applications.kafkaUi.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-ui
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/kafka/ui
    helm:
      valueFiles:
        - ../../ports.yaml
        - values.yaml
        - values-kafka-ui.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-ui
  ignoreDifferences:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
