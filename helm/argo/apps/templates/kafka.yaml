# Wave 5 — Infrastructure services: Kafka cluster
# Dependencies: strimzi-operator (wave 4)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/kafka/cluster
    helm:
      valueFiles:
        - ../../ports.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /spec
    # Ignore Strimzi-managed resources (created dynamically by operator)
    - group: kafka.strimzi.io
      kind: "*"
      jsonPointers:
        - /status
    - group: core.strimzi.io
      kind: "*"
      jsonPointers:
        - /status
  syncPolicy:
    automated:
      prune: false  # Disable pruning - Strimzi manages resources dynamically
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
