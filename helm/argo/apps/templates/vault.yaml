# Wave 6 — Identity & secrets: HashiCorp Vault
# Dependencies: VSO (wave 4)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/secrets/vault/server
    helm:
      valueFiles:
        - ../../../ports.yaml
        - ../../../globals.yaml
        - values.yaml
      valuesObject:
        vault:
          server:
            standalone:
              config: |
                ui = true
                listener "tcp" {
                  tls_disable = 1
                  address = "[::]:8200"
                  cluster_address = "[::]:8201"
                  telemetry {
                    unauthenticated_metrics_access = true
                  }
                }
                storage "file" {
                  path = "/vault/data"
                }
                seal "transit" {
                  address = "http://{{ .Values.transitVaultIP }}:8200"
                  key_name = "autounseal"
                  mount_path = "transit/"
                }
                telemetry {
                  prometheus_retention_time = "30s"
                  disable_hostname = true
                }
  destination:
    server: https://kubernetes.default.svc
    namespace: secrets
  ignoreDifferences:
    - group: ""
      kind: ConfigMap
      jqPathExpressions:
        - .data
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates
        - .spec.template.metadata
    - group: cilium.io
      kind: CiliumNetworkPolicy
      jsonPointers:
        - /spec
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      jsonPointers:
        - /spec/parentRefs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
