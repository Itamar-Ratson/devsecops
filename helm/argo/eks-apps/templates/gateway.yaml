# Wave 3 — Networking: Cilium Gateway API (EKS — AWS NLB)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-gateway
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/networking/gateway/eks
    helm:
      valueFiles:
        - ../../../ports.yaml
        - ../../../globals.yaml
        - values.yaml
  destination:
    server: {{ .Values.eksClusterServer }}
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 15
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
