# Wave 2 — Secrets: External Secrets Operator
# Terraform bootstraps ESO with IRSA annotation; this app adopts the release.
# ignoreDifferences protects the IRSA annotation from being pruned by selfHeal.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-external-secrets
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: "0.14.3"
  destination:
    server: {{ .Values.eksClusterServer }}
    namespace: external-secrets
  ignoreDifferences:
    - kind: ServiceAccount
      name: external-secrets
      namespace: external-secrets
      jsonPointers:
        - /metadata/annotations/eks.amazonaws.com~1role-arn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
