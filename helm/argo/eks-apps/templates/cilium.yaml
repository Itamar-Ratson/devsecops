# Wave 1 — Networking: Cilium CNI (EKS — ENI mode)
# Terraform bootstraps Cilium before ArgoCD; this app adopts the release
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-cilium
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.targetRevision }}
    path: helm/networking/cilium
    helm:
      valueFiles:
        - ../../ports.yaml
        - values.yaml
        - values-eks.yaml
  destination:
    server: {{ .Values.eksClusterServer }}
    namespace: kube-system
  ignoreDifferences:
    - kind: Secret
      name: hubble-ca-cert
      namespace: kube-system
      jsonPointers:
        - /data
    - kind: Secret
      name: hubble-relay-client-certs
      namespace: kube-system
      jsonPointers:
        - /data
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
