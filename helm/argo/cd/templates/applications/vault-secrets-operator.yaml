# Wave 3 — Infrastructure foundations: Vault Secrets Operator
# Dependencies: none (authenticates to Transit Vault, not in-cluster Vault)
{{- if .Values.gitops.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-secrets-operator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: helm/secrets/vault/secrets-operator
    helm:
      valueFiles:
        - ../../../ports.yaml
        - values.yaml
      parameters:
        - name: transitVault.address
          value: {{ .Values.transitVaultIP | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-secrets-operator
  ignoreDifferences:
    - group: secrets.hashicorp.com
      kind: VaultAuth
      jqPathExpressions:
        - .metadata.finalizers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
