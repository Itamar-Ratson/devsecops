# Wave 1 — Security: enforcement — Trivy vulnerability scanner
# Dependencies: none
# Note: creates PrometheusRule (monitoring.coreos.com CRD from wave 7).
# SkipDryRunOnMissingResource lets the sync succeed; self-heal applies it once CRD is ready.
{{- if .Values.gitops.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: helm/security/trivy-operator
    helm:
      valueFiles:
        - ../../ports.yaml
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
{{- end }}
