# Gateway configuration for ArgoCD HTTPRoute
gateway:
  name: main-gateway
  namespace: gateway

# Vault Secrets - enables VaultStaticSecret for syncing secrets from Vault
# Disabled: ArgoCD is Wave 0, before VSO (Wave 2) installs CRDs
# Terraform (argocd-bootstrap) creates argocd-oidc-secret via kubernetes_secret
vaultSecrets:
  enabled: false

# Transit Vault IP on the KinD Docker network (dynamic, set by Terraform)
# Default works for 172.18.x.x subnet; Terraform overrides with actual IP
transitVaultIP: "172.18.0.100"

# Registry cache (Zot) IP on the KinD Docker network (dynamic, set by Terraform)
cacheRegistryIP: "172.18.0.101"

# GitOps repository configuration.
# enabled: false — Terraform's helm_release installs ArgoCD with gitops disabled
# so no Application CRs are rendered by the Helm chart during bootstrap.
# Terraform then applies the root Application CR (terraform_data.argocd_root_application)
# which sets gitops.enabled=true via valuesObject, enabling ArgoCD self-management.
gitops:
  enabled: false
  repoURL: "git@github.com:Itamar-Ratson/devsecops.git"
  targetRevision: HEAD

# Per-application toggles (disable to save resources on constrained hardware)
applications:
  # Kafka UI — disabled to save ~256Mi. Kafka broker + Strimzi are the CV-relevant
  # components; re-enable for visual debugging of topics/consumers.
  kafkaUi:
    enabled: false
  # Juice Shop — disabled to save ~256Mi. OWASP vulnerable app for security demos;
  # re-enable when running Trivy/Kyverno demonstrations.
  juiceShop:
    enabled: false
