{{- if .Values.vaultSecrets.enabled }}
# VaultStaticSecret for Crossplane — syncs AWS credentials from Transit Vault
# Transforms two Vault keys into AWS INI credential format
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: crossplane-aws-credentials
  namespace: {{ .Release.Namespace }}
spec:
  type: kv-v2
  mount: secret
  path: crossplane/aws
  destination:
    name: aws-creds
    create: true
    labels:
      app.kubernetes.io/name: crossplane
    transformation:
      excludeRaw: true
      templates:
        creds:
          text: |
            [default]
            aws_access_key_id = {{ `{{ index .Secrets "aws-access-key-id" }}` }}
            aws_secret_access_key = {{ `{{ index .Secrets "aws-secret-access-key" }}` }}
  refreshAfter: 1h
  vaultAuthRef: secrets/transit-vault-auth
{{- end }}
