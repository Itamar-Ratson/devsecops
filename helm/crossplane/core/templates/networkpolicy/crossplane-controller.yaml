---
# Crossplane controller — needs AWS API egress + webhook ingress
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-controller
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crossplane

  ingress:
    # Allow webhook callbacks from kube-apiserver
    # host + remote-node + cluster required for KinD compatibility
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
        - cluster
      toPorts:
        - ports:
            - port: "{{ .Values.ports.crossplane.webhook }}"
              protocol: TCP

    # Allow Prometheus to scrape metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "{{ .Values.ports.crossplane.metrics }}"
              protocol: TCP

  egress:
    # DNS with L7 interception — required for Cilium to populate FQDN cache
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "{{ .Values.ports.dns }}"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"

    # Allow HTTPS to Crossplane package registry + AWS APIs
    # xpkg.crossplane.io → gateway.scarf.sh → ghcr.io → pkg-containers.githubusercontent.com
    - toFQDNs:
        - matchName: "xpkg.crossplane.io"
        - matchName: "gateway.scarf.sh"
        - matchName: "ghcr.io"
        - matchPattern: "*.githubusercontent.com"
        - matchPattern: "*.amazonaws.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Allow Kubernetes API access
    - toEntities:
        - kube-apiserver
---
# Crossplane RBAC manager
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-rbac-manager
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crossplane-rbac-manager

  egress:
    # Allow Kubernetes API access (manages RBAC resources)
    - toEntities:
        - kube-apiserver
