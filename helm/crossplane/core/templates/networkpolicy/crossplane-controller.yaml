---
# Crossplane controller — needs package registry egress + webhook ingress
#
# NOTE: FQDN-based egress (toFQDNs) does not work in this cluster because
# the allow-cluster-egress CiliumClusterwideNetworkPolicy allows DNS traffic
# at L3/L4 before the per-endpoint DNS L7 proxy can intercept it. Without
# DNS interception, the FQDN cache stays empty and toFQDNs rules block all
# traffic. We use toEntities: world with port restrictions instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-controller
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crossplane

  ingress:
    # Allow webhook callbacks from kube-apiserver
    # host + remote-node + cluster required for KinD compatibility
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
        - cluster
      toPorts:
        - ports:
            - port: "{{ .Values.ports.crossplane.webhook }}"
              protocol: TCP

    # Allow Prometheus to scrape metrics
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "{{ .Values.ports.crossplane.metrics }}"
              protocol: TCP

  egress:
    # Allow HTTPS to package registries + AWS APIs
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Allow Kubernetes API access
    - toEntities:
        - kube-apiserver
---
# Crossplane RBAC manager
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-rbac-manager
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: crossplane-rbac-manager

  egress:
    # Allow Kubernetes API access (manages RBAC resources)
    - toEntities:
        - kube-apiserver
---
# Provider and function pods — dynamically created by Crossplane.
# Uses pkg.crossplane.io/revision label to match all provider/function pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crossplane-providers
  namespace: {{ .Release.Namespace }}
spec:
  endpointSelector:
    matchExpressions:
      - key: pkg.crossplane.io/revision
        operator: Exists

  egress:
    # Allow HTTPS to AWS APIs
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

    # Allow Kubernetes API access (providers manage CRs)
    - toEntities:
        - kube-apiserver

    # Allow gRPC between provider/function pods (Composition pipeline)
    - toEndpoints:
        - matchExpressions:
            - key: pkg.crossplane.io/revision
              operator: Exists
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
