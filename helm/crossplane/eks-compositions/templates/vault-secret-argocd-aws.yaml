# Sync AWS credentials from Vault to ArgoCD namespace.
# ArgoCD's application-controller needs these to authenticate to EKS
# via awsAuthConfig (sts:AssumeRole).
# The credentials file is volume-mounted at /home/argocd/.aws/credentials
# (configured in argo/cd values-argocd.yaml).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: argocd-aws-credentials
  namespace: argocd
spec:
  type: kv-v2
  mount: secret
  path: crossplane/aws
  destination:
    name: argocd-aws-creds
    create: true
    transformation:
      excludeRaw: true
      templates:
        credentials:
          text: |
            [default]
            aws_access_key_id = {{`{{ index .Secrets "aws-access-key-id" }}`}}
            aws_secret_access_key = {{`{{ index .Secrets "aws-secret-access-key" }}`}}
  refreshAfter: 1h
  vaultAuthRef: secrets/transit-vault-auth
