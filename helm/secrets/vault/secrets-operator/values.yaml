# Transit Vault configuration (external Docker container for static secrets)
transitVault:
  enabled: true
  # This IP is set by Terraform based on the KinD network subnet
  # Note: KinD subnet varies (172.18.x.x, 172.19.x.x, 172.20.x.x)
  # Terraform sets transitVaultIP which ArgoCD uses via Application parameters
  address: "172.18.0.100"

vault-secrets-operator:
  # Default Vault connection configuration (in-cluster Vault - for future dynamic secrets)
  defaultVaultConnection:
    enabled: true
    address: "http://vault.secrets.svc.cluster.local:8200"
    skipTLSVerify: false

  # Default auth method configuration
  defaultAuthMethod:
    enabled: true
    namespace: "secrets"
    method: kubernetes
    mount: kubernetes
    kubernetes:
      role: vault-secrets-operator
      serviceAccount: vault-secrets-operator-controller-manager
      tokenAudiences: []

  controller:
    replicas: 1
    resources:
      limits:
        cpu: 500m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 64Mi  # Right-sized: ~40Mi actual
