name: Deployment and DAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1-5'  # 3 AM UTC, weekdays

env:
  REGISTRY: ghcr.io
  # Keep in sync with terraform/modules/k8s/bootstrap/cluster/variables.tf
  # Also referenced in ci.yaml (comment only)
  GATEWAY_API_VERSION: v1.4.0
  CILIUM_VERSION: v1.18.5

permissions:
  id-token: write      # required for GitHub OIDC token minting -> AWS AssumeRole
  contents: read
  packages: write

jobs:
  deployment-and-dast:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          # renovate: datasource=github-releases depName=gruntwork-io/terragrunt extractVersion=^v(?<version>.*)$
          curl -sfL "https://github.com/gruntwork-io/terragrunt/releases/download/v0.99.2/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          # renovate: datasource=github-releases depName=helm/helm extractVersion=^v(?<version>.*)$
          version: 'v3.14.0'

      - name: Install crane
        run: |
          # renovate: datasource=github-releases depName=google/go-containerregistry extractVersion=^v(?<version>.*)$
          curl -sfL "https://github.com/google/go-containerregistry/releases/download/v0.20.7/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/devsecops-github-actions
          aws-region: ${{ vars.AWS_REGION }}

      - name: Create CI overrides
        run: |
          # vault_root_token: vault/transit reads it from secrets.tfvars.
          # In CI vault/transit runs (not filtered), so we provide a dummy value.
          cat > terraform/live/secrets.tfvars << 'EOF'
          vault_root_token = "ci-test-token"
          EOF
          # Non-sensitive CI-only overrides for the argocd module.
          # Secrets (github_token, argocd_oidc_client_secret) are now read from
          # SSM by run_cmd in terragrunt.hcl using the AWS credentials above.
          cat > terraform/live/k8s/bootstrap/argocd/ci.auto.tfvars << EOF
          git_repo_url      = "https://github.com/${{ github.repository }}"
          create_deploy_key = false
          ci_values         = true
          EOF

      - name: Build Helm chart dependencies
        run: |
          helm repo add cilium https://helm.cilium.io
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm dependency build helm/networking/cilium/
          helm dependency build helm/secrets/sealed-secrets/
          helm dependency build helm/argo/cd/

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad  # v4.0.0

      - name: Verify juice-shop image signature
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}/juice-shop" | tr '[:upper:]' '[:lower:]')
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/ci.yaml@.*" \
            "${{ env.REGISTRY }}/${IMAGE_NAME}:main" || \
            echo "WARNING: Image signature verification failed (may not be signed yet)"

      - name: Pre-create KinD Docker network with explicit subnet
        run: |
          docker network create \
            --driver bridge \
            --subnet 172.18.0.0/16 \
            kind 2>/dev/null || echo "kind network already exists"

      - name: Deploy infrastructure with Terragrunt
        run: |
          cd terraform/live
          terragrunt run --all apply --non-interactive \
            --queue-exclude-dir "aws/*" \
            --queue-exclude-dir "*/workspace" \
            --queue-exclude-dir "registry/warm"
        timeout-minutes: 20

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          kind get kubeconfig --name on-prem > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Warm Zot cache from GHCR
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
          ./.github/scripts/ci-warm-zot.sh

      - name: Wait for ArgoCD sync
        run: |
          kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-server --timeout=300s
          kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-repo-server --timeout=300s
          # Single shared deadline for all apps.
          # juice-shop is sync-wave 9. All prior waves must be Healthy first.
          # vault/config now runs in CI (mirrors local deploy order) so VSO can
          # auth to Vault and sync keycloak secrets → keycloak pod starts normally.
          # Keycloak (wave 6, JVM + DB init) is still the slowest gate: ~15 min.
          DEADLINE=$((SECONDS + 2700))
          echo "Waiting for juice-shop to sync (wave 9 — all prior waves must complete first)..."
          until [ "$(kubectl get application juice-shop -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null)" = "Synced" ] \
             && [ "$(kubectl get application juice-shop -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null)" = "Healthy" ]; do
            if [ $SECONDS -ge $DEADLINE ]; then
              echo "Timed out waiting for juice-shop"
              echo "=== Root app (argocd) operation state ==="
              kubectl get application argocd -n argocd -o jsonpath='{.status.operationState.phase}' 2>/dev/null; echo
              kubectl get application argocd -n argocd -o jsonpath='{.status.operationState.message}' 2>/dev/null; echo
              echo "=== All apps ==="
              kubectl get applications -n argocd 2>/dev/null || true
              exit 1
            fi
            SYNCED=$(kubectl get applications -n argocd -o jsonpath='{range .items[?(@.status.sync.status=="Synced")]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -c . || echo 0)
            TOTAL=$(kubectl get applications -n argocd -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null | grep -c . || echo 0)
            echo "  juice-shop: $(kubectl get application juice-shop -n argocd \
              -o jsonpath='{.status.sync.status}/{.status.health.status}' 2>/dev/null || echo 'not found') ($SYNCED/$TOTAL apps synced)"
            sleep 15
          done
          echo "juice-shop is Synced/Healthy"

      # --- Deployment verification ---
      - name: Verify rollout
        run: |
          kubectl -n apps wait --for=condition=Ready pod -l app=juice-shop --timeout=120s
          kubectl get rollout -n apps
          kubectl get pods -n apps
          kubectl get svc -n apps

      - name: Test application health
        run: |
          kubectl port-forward -n apps svc/juice-shop-stable 3000:80 &
          sleep 10
          curl -sf http://localhost:3000/ || exit 1
          echo "Health check passed"

      # --- DAST scanning ---
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Run OWASP ZAP Full Scan (on main only)
        if: github.ref == 'refs/heads/main'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l WARN -T 60'
          allow_issue_writing: false
          artifact_name: 'zap-full-report'

      # --- Cache images for next run ---
      - name: Save images to GHCR cache
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
          ./.github/scripts/ci-save-images.sh

      # --- Cleanup ---
      - name: Export deployment artifacts
        if: always()
        run: |
          kubectl get all -n apps -o yaml > /tmp/deployment-state.yaml 2>/dev/null || true
          kubectl logs -n apps -l app=juice-shop --tail=100 > /tmp/app-logs.txt 2>/dev/null || true

      - name: Pre-destroy cleanup
        if: always()
        run: |
          echo "Stripping ArgoCD finalizers and pre-uninstalling Helm release..."
          kubectl delete applications -n argocd --all --wait=false 2>/dev/null || true
          kubectl get applications -n argocd -o name 2>/dev/null | \
            xargs -r -I{} kubectl patch {} -n argocd \
              --type merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl get jobs -n "$ns" -o jsonpath='{range .items[?(@.metadata.finalizers)]}{.metadata.name}{"\n"}{end}' 2>/dev/null | \
              xargs -r -I{} kubectl patch job {} -n "$ns" \
                --type merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          done
          kubectl delete validatingwebhookconfigurations -l app.kubernetes.io/part-of=argocd 2>/dev/null || true
          kubectl delete mutatingwebhookconfigurations -l app.kubernetes.io/part-of=argocd 2>/dev/null || true
          kubectl scale deploy --all -n argocd --replicas=0 --timeout=30s 2>/dev/null || true
          kubectl delete pods -n argocd --all --force --grace-period=0 2>/dev/null || true
          helm uninstall argocd -n argocd --no-hooks --wait=false --timeout=60s 2>/dev/null || true

      - name: Destroy infrastructure
        if: always()
        run: |
          cd terraform/live
          terragrunt run --all destroy --non-interactive \
            --queue-exclude-dir "aws/*" \
            --queue-exclude-dir "*/workspace" \
            --queue-exclude-dir "registry/warm"
        timeout-minutes: 10

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            /tmp/deployment-state.yaml
            /tmp/app-logs.txt
