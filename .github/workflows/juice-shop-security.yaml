name: Juice Shop Security Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'docker/juice-shop/**'
      - '.github/workflows/juice-shop-security.yaml'
      - '.github/scripts/**'
      - '.github/zap/**'
      - 'terraform/modules/**'
      - 'terraform/live/**'
  pull_request:
    branches: [main]
    paths:
      - 'helm/**'
      - 'docker/juice-shop/**'
      - '.github/workflows/juice-shop-security.yaml'
      - '.github/scripts/**'
      - '.github/zap/**'
      - 'terraform/modules/**'
      - 'terraform/live/**'

env:
  REGISTRY: ghcr.io
  # Keep in sync with terraform/modules/k8s/bootstrap/cluster/variables.tf
  GATEWAY_API_VERSION: v1.4.0
  CILIUM_VERSION: v1.18.5

permissions:
  contents: read
  packages: write
  security-events: write
  pull-requests: write

jobs:
  # Job 1: Build and push container image
  build:
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tag: ${{ steps.meta.outputs.tags }}
      image-name: ${{ steps.image-name.outputs.image_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image-name
        run: |
          IMAGE_NAME=$(echo "${{ github.repository }}/juice-shop" | tr '[:upper:]' '[:lower:]')
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image-name.outputs.image_name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/juice-shop
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.ref_name }}

  # Job 2: Container security scanning (Trivy)
  container-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning (PR only)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: docker/juice-shop
          load: true
          tags: juice-shop-scan:local

      - name: Run Trivy vulnerability scanner (PR)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop-scan:local'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'
          timeout: '10m'

      - name: Run Trivy vulnerability scanner (Push)
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ needs.build.outputs.image-name }}@${{ needs.build.outputs.image-digest }}'
          format: 'sarif'
          output: 'trivy-container-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          scanners: 'vuln,secret,misconfig'
          timeout: '10m'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-container-results.sarif'
          category: 'trivy-container'

      - name: Trivy summary report (fail on CRITICAL/HIGH)
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop-scan:local'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          vuln-type: 'os,library'

  # Job 3: IaC security scanning (Trivy)
  iac-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy IaC scanner on Helm charts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'helm/'
          format: 'sarif'
          output: 'trivy-iac-helm-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy Helm IaC results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-iac-helm-results.sarif'
          category: 'trivy-iac-helm'

      - name: Run Trivy IaC scanner on Terraform
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'terraform/'
          format: 'sarif'
          output: 'trivy-iac-terraform-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Upload Trivy Terraform IaC results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-iac-terraform-results.sarif'
          category: 'trivy-iac-terraform'

      - name: Run Trivy IaC scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'helm/apps/juice-shop/'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'

  # Job 4: Helm lint and validation
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Cache Helm chart dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/helm
          key: helm-deps-${{ hashFiles('helm/**/Chart.yaml') }}
          restore-keys: |
            helm-deps-

      - name: Add Helm repos
        run: |
          helm repo add cilium             https://helm.cilium.io
          helm repo add kafka-ui           https://provectus.github.io/kafka-ui-charts
          helm repo add kyverno            https://kyverno.github.io/kyverno/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana            https://grafana.github.io/helm-charts
          helm repo add open-telemetry     https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo add sealed-secrets     https://bitnami-labs.github.io/sealed-secrets
          helm repo add aquasecurity       https://aquasecurity.github.io/helm-charts/
          helm repo add hashicorp          https://helm.releases.hashicorp.com
          helm repo add codecentric        https://codecentric.github.io/helm-charts
          helm repo add argo               https://argoproj.github.io/argo-helm
          helm repo add headlamp           https://kubernetes-sigs.github.io/headlamp/
          helm repo add jetstack           https://charts.jetstack.io
          helm repo add strimzi            https://strimzi.io/charts/
          helm repo update

      - name: Build Helm chart dependencies
        run: |
          for chart in \
            helm/certificates/cert-manager \
            helm/certificates/trust-manager \
            helm/networking/cilium \
            helm/security/tetragon \
            helm/kafka/ui \
            helm/security/kyverno/engine \
            helm/security/kyverno/policies \
            helm/observability/monitoring \
            helm/observability/opentelemetry-operator \
            helm/secrets/sealed-secrets \
            helm/security/trivy-operator \
            helm/secrets/vault/server \
            helm/secrets/vault/secrets-operator \
            helm/identity/keycloak \
            helm/argo/rollouts \
            helm/argo/cd \
            helm/kafka/operator \
            helm/observability/headlamp; do
            echo "=== Building deps: $chart ==="
            helm dependency build "$chart"
          done

      - name: Lint all Helm charts
        run: |
          find helm -name "Chart.yaml" ! -path "*/charts/*" -exec dirname {} \; | sort | \
          while read chart; do
            values_args="-f helm/ports.yaml"
            for vf in "$chart"/values*.yaml; do
              [ -f "$vf" ] && values_args="$values_args -f $vf"
            done
            echo "=== Linting $chart ==="
            helm lint "$chart" $values_args
          done

      - name: Render and upload juice-shop manifests
        run: |
          helm template juice-shop helm/apps/juice-shop/ \
            -f helm/ports.yaml \
            -f helm/apps/juice-shop/values.yaml \
            --namespace juice-shop \
            > /tmp/rendered.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: /tmp/rendered.yaml

  # Job 5: Kyverno policy testing
  kyverno-test:
    runs-on: ubuntu-latest
    needs: helm-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install Kyverno CLI
        run: |
          curl -LO https://github.com/kyverno/kyverno/releases/download/v1.16.2/kyverno-cli_v1.16.2_linux_x86_64.tar.gz
          tar -xzf kyverno-cli_v1.16.2_linux_x86_64.tar.gz
          sudo mv kyverno /usr/local/bin/
          kyverno version

      - name: Render Helm templates
        run: |
          helm template juice-shop helm/apps/juice-shop/ \
            -f helm/ports.yaml \
            -f helm/apps/juice-shop/values.yaml \
            --namespace juice-shop \
            > /tmp/juice-shop-rendered.yaml

      - name: Download Kyverno Pod Security Standard policies
        run: |
          mkdir -p /tmp/policies
          curl -sL https://raw.githubusercontent.com/kyverno/policies/main/pod-security/restricted/disallow-capabilities-strict/disallow-capabilities-strict.yaml \
            -o /tmp/policies/disallow-capabilities-strict.yaml
          curl -sL https://raw.githubusercontent.com/kyverno/policies/main/pod-security/restricted/disallow-privilege-escalation/disallow-privilege-escalation.yaml \
            -o /tmp/policies/disallow-privilege-escalation.yaml
          curl -sL https://raw.githubusercontent.com/kyverno/policies/main/pod-security/restricted/require-run-as-nonroot/require-run-as-nonroot.yaml \
            -o /tmp/policies/require-run-as-nonroot.yaml

      - name: Test against Kyverno policies
        run: |
          kyverno apply /tmp/policies/ \
            --resource /tmp/juice-shop-rendered.yaml \
            --detailed-results \
            --audit-warn || true

      - name: Run custom policy tests
        if: hashFiles('tests/kyverno/juice-shop-policy-test.yaml') != ''
        run: |
          kyverno test tests/kyverno/ --detailed-results || true

  # Job 6: Terraform validation
  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive terraform/modules/

      - name: Validate Terraform modules
        run: |
          for module in $(find terraform/modules -name "*.tf" -not -path "*/.terraform/*" -exec dirname {} \; | sort -u); do
            echo "=== Validating $module ==="
            terraform -chdir="$module" init -backend=false
            terraform -chdir="$module" validate
          done

  # Job 7: KinD deployment + DAST scanning (single job to avoid double deploy/destroy)
  deployment-and-dast:
    runs-on: ubuntu-latest
    needs: [container-scan, iac-scan, kyverno-test, terraform-validate]
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Terragrunt
        run: |
          curl -sfL "https://github.com/gruntwork-io/terragrunt/releases/download/v0.99.2/terragrunt_linux_amd64" -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Install crane
        run: |
          curl -sfL "https://github.com/google/go-containerregistry/releases/download/v0.20.7/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - crane
          sudo mv crane /usr/local/bin/

      - name: Create CI secrets
        run: |
          cat > terraform/live/secrets.tfvars << 'EOF'
          vault_root_token = "ci-test-token"
          EOF
          cat > terraform/live/k8s/bootstrap/argocd/ci.auto.tfvars << EOF
          git_repo_url              = "https://github.com/${{ github.repository }}"
          github_token              = "unused"
          argocd_oidc_client_secret = "ci-dummy-oidc-secret"
          create_deploy_key         = false
          juice_shop_enabled        = true
          EOF

      - name: Build Helm chart dependencies
        run: |
          helm repo add cilium https://helm.cilium.io
          helm repo add sealed-secrets https://bitnami-labs.github.io/sealed-secrets
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm dependency build helm/networking/cilium/
          helm dependency build helm/secrets/sealed-secrets/
          helm dependency build helm/argo/cd/

      - name: Pre-create KinD Docker network with explicit subnet
        run: |
          docker network create \
            --driver bridge \
            --subnet 172.18.0.0/16 \
            kind 2>/dev/null || echo "kind network already exists"

      - name: Deploy infrastructure with Terragrunt
        run: |
          cd terraform/live
          terragrunt run --all apply --non-interactive \
            --filter '!registry/cache/workspace' \
            --filter '!registry/warm/workspace' \
            --filter '!vault/transit/workspace' \
            --filter '!vault/config/workspace' \
            --filter '!k8s/kind/workspace' \
            --filter '!k8s/bootstrap/cluster/workspace' \
            --filter '!k8s/bootstrap/argocd/workspace' \
            --filter '!vault/config' \
            --filter '!registry/warm'
        timeout-minutes: 20

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          kind get kubeconfig --name on-prem > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Warm Zot cache from GHCR
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
          ./.github/scripts/ci-warm-zot.sh

      - name: Wait for ArgoCD sync
        run: |
          kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-server --timeout=300s
          kubectl -n argocd wait --for=condition=Ready pod -l app.kubernetes.io/name=argocd-repo-server --timeout=300s
          # Single shared deadline for all apps.
          # juice-shop is sync-wave 9 — it can only be created after waves 1-8 are
          # healthy. argo-rollouts (wave 4) alone took ~9 min in CI, so later waves
          # easily consume the remaining time of a per-app timer.
          DEADLINE=$((SECONDS + 1200))
          for app in network-policies argo-rollouts juice-shop; do
            echo "Waiting for $app to sync..."
            until [ "$(kubectl get application "$app" -n argocd -o jsonpath='{.status.sync.status}' 2>/dev/null)" = "Synced" ] \
               && [ "$(kubectl get application "$app" -n argocd -o jsonpath='{.status.health.status}' 2>/dev/null)" = "Healthy" ]; do
              if [ $SECONDS -ge $DEADLINE ]; then
                echo "Timed out waiting for $app"
                kubectl get applications -n argocd 2>/dev/null || true
                kubectl get application "$app" -n argocd -o yaml 2>/dev/null || true
                exit 1
              fi
              echo "  $app: $(kubectl get application "$app" -n argocd \
                -o jsonpath='{.status.sync.status}/{.status.health.status}' 2>/dev/null || echo 'not found')"
              sleep 15
            done
            echo "$app is Synced/Healthy"
          done

      # --- Deployment verification ---
      - name: Verify rollout
        run: |
          kubectl -n juice-shop wait --for=condition=Ready pod -l app=juice-shop --timeout=120s
          kubectl get rollout -n juice-shop
          kubectl get pods -n juice-shop
          kubectl get svc -n juice-shop

      - name: Test application health
        run: |
          kubectl port-forward -n juice-shop svc/juice-shop-stable 3000:80 &
          sleep 10
          curl -sf http://localhost:3000/ || exit 1
          echo "Health check passed"

      # --- DAST scanning ---
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l WARN'
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Run OWASP ZAP Full Scan (on main only)
        if: github.ref == 'refs/heads/main'
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: '.github/zap/rules.tsv'
          cmd_options: '-a -j -l WARN -T 60'
          allow_issue_writing: false
          artifact_name: 'zap-full-report'

      # --- Cache images for next run ---
      - name: Save images to GHCR cache
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_PAT }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | crane auth login ghcr.io -u ${{ github.actor }} --password-stdin
          ./.github/scripts/ci-save-images.sh

      # --- Cleanup ---
      - name: Export deployment artifacts
        if: always()
        run: |
          kubectl get all -n juice-shop -o yaml > /tmp/deployment-state.yaml 2>/dev/null || true
          kubectl logs -n juice-shop -l app=juice-shop --tail=100 > /tmp/app-logs.txt 2>/dev/null || true

      - name: Pre-destroy cleanup
        if: always()
        run: |
          echo "Stripping ArgoCD finalizers and pre-uninstalling Helm release..."
          kubectl delete applications -n argocd --all --wait=false 2>/dev/null || true
          kubectl get applications -n argocd -o name 2>/dev/null | \
            xargs -r -I{} kubectl patch {} -n argocd \
              --type merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          for ns in $(kubectl get ns -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            kubectl get jobs -n "$ns" -o jsonpath='{range .items[?(@.metadata.finalizers)]}{.metadata.name}{"\n"}{end}' 2>/dev/null | \
              xargs -r -I{} kubectl patch job {} -n "$ns" \
                --type merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          done
          kubectl delete validatingwebhookconfigurations -l app.kubernetes.io/part-of=argocd 2>/dev/null || true
          kubectl delete mutatingwebhookconfigurations -l app.kubernetes.io/part-of=argocd 2>/dev/null || true
          kubectl scale deploy --all -n argocd --replicas=0 --timeout=30s 2>/dev/null || true
          kubectl delete pods -n argocd --all --force --grace-period=0 2>/dev/null || true
          helm uninstall argocd -n argocd --no-hooks --wait=false --timeout=60s 2>/dev/null || true

      - name: Destroy infrastructure
        if: always()
        run: |
          cd terraform/live
          terragrunt run --all destroy --non-interactive \
            --filter '!registry/cache/workspace' \
            --filter '!registry/warm/workspace' \
            --filter '!vault/transit/workspace' \
            --filter '!vault/config/workspace' \
            --filter '!k8s/kind/workspace' \
            --filter '!k8s/bootstrap/cluster/workspace' \
            --filter '!k8s/bootstrap/argocd/workspace' \
            --filter '!vault/config' \
            --filter '!registry/warm'
        timeout-minutes: 10

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-artifacts
          path: |
            /tmp/deployment-state.yaml
            /tmp/app-logs.txt
